  # ==================================================================
  - description: "Negative/docs+tests: recommends against a flag for a docs and test-only change"
    providers: ["judgment"]
    vars:
      user_request: >
        Should this be behind a feature flag?
      codebase_context: >
        Small TypeScript library. README.md is user documentation; src/slug.ts is
