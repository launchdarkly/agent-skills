  # ==================================================================
  # AMBIGUOUS (judgment) — low-stakes internal behavior tweak
  # A background email worker's retry limit is bumped 3 -> 5. It IS a
  # runtime behavior change (so not dismissible as a refactor), but it's
  # internal, off the request path, low-risk, and trivially reversible —
  # no user-facing, money, or security signal in either direction. This
  # is the genuinely-balanced case: we do NOT assert a verdict direction,
  # we score the RATIONALE, and here low/medium confidence is the honest
  # answer, so the "not high" criterion is fair.
  # ==================================================================
  - description: "Ambiguous/low-stakes tweak: scored on rationale quality, not verdict direction"
    providers: ["judgment"]
    vars:
      user_request: >
        Should this change be behind a feature flag?
      codebase_context: >
        Internal background worker. src/workers/emailWorker.js retries failed
        notification-email sends off the request path on a queue; failures are
        logged and picked up again next cycle. MAX_RETRIES bounds attempts per
        message. Not user-facing; no money, auth, or personal data involved.
      git_diff: |
        diff --git a/src/workers/emailWorker.js b/src/workers/emailWorker.js
        index 7a1b2c3..9d4e5f6 100644
        --- a/src/workers/emailWorker.js
        +++ b/src/workers/emailWorker.js
        @@ -2,7 +2,7 @@ const { sendEmail } = require('../lib/mailer');
         const { logger } = require('../lib/log');

        -// Give up after 3 attempts per message.
        -const MAX_RETRIES = 3;
        +// Give up after 5 attempts per message.
        +const MAX_RETRIES = 5;

         async function processMessage(msg) {
           for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
    assert:
      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const call = traj.find(t => t.tool === 'recommend-flag');
          if (!call) return { pass: false, score: 0, reason: 'No recommend-flag verdict emitted' };
          const a = call.arguments || {};
          const hasReasons = Array.isArray(a.reasons) && a.reasons.length > 0;
          const validConf = ['low','medium','high'].includes(a.confidence);
          const pass = typeof a.recommend === 'boolean' && hasReasons && validConf;
          return { pass, score: pass ? 1 : 0, reason: `recommend=${a.recommend} confidence=${a.confidence} reasons=${(a.reasons||[]).length}` };
        metric: emitted_structured_verdict
        weight: 2

      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const forbidden = ['create-flag','create-feature-flag','update-flag-settings','update-feature-flag','toggle-flag','delete-flag'];
          const called = forbidden.filter(f => tools.includes(f));
          const pass = called.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'stayed advisory' : 'called mutating tools: ' + called.join(', ') };
        metric: stayed_advisory
        weight: 2

      - type: llm-rubric
        value: |
          The change bumps a background email worker's retry limit from 3 to 5. It IS
          a runtime behavior change, but it is internal (off the request path), low-
          risk, trivially reversible, and involves no user-facing surface, money, or
          security. This is a genuinely borderline case with no dominant signal in
          either direction; judge the REASONING, not the verdict direction.
          Score 1.0 if ALL of the following hold:
          1. The rationale weighs both sides — it acknowledges the change alters
             runtime behavior AND that the blast radius is low/internal/reversible.
          2. Confidence is NOT "high" — a genuinely borderline change with no dominant
             signal is honestly low or medium.
          3. The reasons are specific to this change (background retry limit / internal
             worker), not generic boilerplate.
          4. It stays advisory — no flag was created or modified.
          Deduct 0.25 for each criterion missed.
        metric: rationale_quality
        weight: 3

  # ==================================================================
  # ALREADY GATED (judgment) — the change ships behind a flag already
  # A new export endpoint is added, but the diff itself wraps it in a
  # LaunchDarkly flag check. Asking "should this be behind a flag?" here
  # should yield recommend: false — it already is. This mirrors the
  # real-world observation that a flag-introducing PR contains its own
  # gate, so the honest answer is "already handled" (note the key).
  # ==================================================================
  - description: "Already gated: recommends against re-flagging a change that already sits behind a flag"
    providers: ["judgment"]
    vars:
      user_request: >
        Should this change be behind a feature flag?
      codebase_context: >
        Node.js Express API using the LaunchDarkly Node server SDK. The standard
        flag check is `client.variation(key, ldContext(user), default)`; routes
        live in src/routes/.
      git_diff: |
        diff --git a/src/routes/reports.js b/src/routes/reports.js
        index 2c1d3e4..7a8b9c0 100644
        --- a/src/routes/reports.js
        +++ b/src/routes/reports.js
        @@ -18,6 +18,14 @@ router.get('/reports', async (req, res) => {
           res.json(await listReports(req.user));
         });

        +// New: CSV export of the user's reports.
        +router.get('/reports/export', async (req, res) => {
        +  const enabled = await client.variation('reports-csv-export', ldContext(req.user), false);
        +  if (!enabled) {
        +    return res.status(404).end();
        +  }
        +  res.type('text/csv').send(await buildReportCsv(req.user));
        +});
        +
         module.exports = router;
    assert:
      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const call = traj.find(t => t.tool === 'recommend-flag');
          if (!call) return { pass: false, score: 0, reason: 'No recommend-flag verdict emitted' };
          const a = call.arguments || {};
          const pass = a.recommend === false;
          return { pass, score: pass ? 1 : 0, reason: `recommend=${a.recommend} confidence=${a.confidence}` };
        metric: verdict_match
        weight: 3

      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const forbidden = ['create-flag','create-feature-flag','update-flag-settings','update-feature-flag','toggle-flag','delete-flag'];
          const called = forbidden.filter(f => tools.includes(f));
          const pass = called.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'stayed advisory' : 'called mutating tools: ' + called.join(', ') };
        metric: stayed_advisory
        weight: 2

      - type: llm-rubric
        value: |
          The diff adds a new /reports/export endpoint, but it is ALREADY gated
          behind the LaunchDarkly flag 'reports-csv-export' (the change checks
          client.variation('reports-csv-export', ...) and 404s when off).
          Evaluate the agent's recommendation:
          1. Did it recommend AGAINST adding a flag (recommend: false), recognizing
             the change is already behind one?
          2. Do its reasons cite the existing flag key ('reports-csv-export') as the
             reason it's already handled?
          3. Did it avoid creating or modifying any flag (advisory only)?
          Score 1.0 if all three. Deduct 0.34 per criterion missed.
        metric: rationale_quality
        weight: 2

  # ==================================================================
  # UNGATED MIRROR (judgment) — the SAME endpoint, without the flag
  # The identical new export endpoint, but shipped with no flag gate.
  # This is the mirror of the "already gated" case: the same change now
